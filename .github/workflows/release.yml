# Publica uma versão na página "Releases" do GitHub com:
#  - sisferias-vX.Y.Z-instalador-windows.exe  (instalador do Windows)
#  - sisferias_X.Y.Z_amd64.deb                 (pacote do Ubuntu)
#  - sisferias-X.Y.Z-1.x86_64.rpm              (pacote do Oracle Linux / Red Hat 8 e 9)
#  - sisferias-vX.Y.Z-windows.zip / -linux.zip (pacotes completos, sem instalador)
#  - sisferias-instalador-windows.exe / -ubuntu.deb / -oracle-linux.rpm: os mesmos
#    instaladores com nome fixo, para o link "releases/latest/download/..." do
#    README baixar sempre a última versão com um clique
#  - SISFERIAS-completo.zip: os dois instaladores, o Manual do Usuário, o guia de
#    instalação e um LEIA-ME (extrair e clicar)
# Todos com o Node.js e o PostgreSQL embutidos (nada para instalar antes).
# Antes de publicar, os testes rodam e os dois instaladores são instalados e
# desinstalados de verdade (workflow "Instaladores").
#
# Duas formas de publicar uma versão:
#  - enviar uma etiqueta "v*" (ex.: git tag v3.1.0 && git push origin v3.1.0);
#  - ou, pelo GitHub: Actions > "Pacote de instalação" > Run workflow,
#    informando a versão (ex.: v3.1.0).
name: Pacote de instalação

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a publicar (ex.: v3.1.0)'
        required: true

permissions:
  contents: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
    steps:
      - id: v
        env:
          VERSAO: ${{ github.event.inputs.versao || github.ref_name }}
        run: |
          if ! echo "$VERSAO" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Versão inválida: '$VERSAO' (use o formato v3.1.0)"; exit 1
          fi
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"

  instaladores:
    needs: conferir
    uses: ./.github/workflows/instaladores.yml
    with:
      versao: ${{ needs.conferir.outputs.versao }}

  publicar:
    needs: [conferir, instaladores]
    runs-on: ubuntu-latest
    env:
      VERSAO: ${{ needs.conferir.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: codigo
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Instaladores com nome fixo e pacote completo
        run: |
          cd arquivos
          cp sisferias-*-instalador-windows.exe sisferias-instalador-windows.exe
          cp sisferias_*_amd64.deb sisferias-instalador-ubuntu.deb
          cp sisferias-*.x86_64.rpm sisferias-instalador-oracle-linux.rpm
          P="SISFERIAS-${VERSAO}"
          mkdir -p "$P/Windows" "$P/Ubuntu" "$P/Oracle Linux" "$P/docs"
          cp sisferias-instalador-windows.exe "$P/Windows/"
          cp sisferias-instalador-ubuntu.deb "$P/Ubuntu/"
          cp sisferias-instalador-oracle-linux.rpm "$P/Oracle Linux/"
          cp ../codigo/INSTALACAO.md "$P/"
          cp ../codigo/docs/Manual_do_Usuario_SISFERIAS.pdf "$P/"
          cp -r ../codigo/docs/capturas-instalador "$P/docs/"
          cat > "$P/LEIA-ME.txt" <<EOF
          SISFERIAS ${VERSAO} - Sistema de Planejamento e Controle de Férias

          WINDOWS
            Abra a pasta "Windows" e dê dois cliques em sisferias-instalador-windows.exe.
            Siga o assistente (Avançar, Avançar, Instalar, Concluir).
            Se aparecer "O Windows protegeu o computador", clique em
            "Mais informações" e depois em "Executar assim mesmo".

          UBUNTU
            Abra a pasta "Ubuntu" e dê dois cliques em sisferias-instalador-ubuntu.deb,
            ou no terminal: sudo apt install ./Ubuntu/sisferias-instalador-ubuntu.deb

          ORACLE LINUX (e Red Hat, Rocky, AlmaLinux 8 ou 9)
            No terminal, dentro da pasta extraída:
            sudo dnf install "./Oracle Linux/sisferias-instalador-oracle-linux.rpm"

          Não é preciso instalar mais nada nem ter internet.
          No final aparece a senha provisória do administrador.
          GUARDE UMA CÓPIA do arquivo data/chave-dados.key fora do servidor.
          Manual do Usuário: Manual_do_Usuario_SISFERIAS.pdf
          Guia de instalação: INSTALACAO.md
          EOF
          sed -i 's/^          //' "$P/LEIA-ME.txt"
          zip -qr SISFERIAS-completo.zip "$P"
          rm -rf "$P"
          ls -la
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSAO }}
          target_commitish: ${{ github.sha }}
          name: SISFERIAS ${{ env.VERSAO }}
          files: arquivos/*
          body: |
            ## Como instalar

            **Mais fácil:** baixe **SISFERIAS-completo.zip**, extraia e dê dois cliques no instalador da pasta
            **Windows** ou **Ubuntu** (o LEIA-ME.txt explica).

            **Windows:** baixe **sisferias-${{ env.VERSAO }}-instalador-windows.exe**, dê dois cliques e siga o assistente
            (Avançar, Avançar, Concluir). O sistema fica em `C:\SISFERIAS`, inicia sozinho com o Windows e ganha um atalho
            "SISFERIAS" na área de trabalho. No final aparece a senha provisória do administrador.
            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo**.

            **Oracle Linux (e Red Hat, Rocky, AlmaLinux) 8 ou 9:** baixe **sisferias-instalador-oracle-linux.rpm** e instale com
            `sudo dnf install ./sisferias-instalador-oracle-linux.rpm`. Fica em `/opt/sisferias`, inicia sozinho com o computador;
            o endereço e a senha provisória aparecem no final.

            **Ubuntu:** baixe o arquivo **.deb** e instale com dois cliques ou pelo terminal:
            `sudo apt install ./sisferias_*.deb`. O sistema fica em `/opt/sisferias` e inicia sozinho com o computador;
            o endereço e a senha provisória aparecem no final.

            Não é preciso instalar Node.js nem banco de dados, nem ter internet: tudo vem junto.
            Os arquivos **.zip** são os mesmos pacotes sem instalador (extrair e executar `iniciar.bat` / `iniciar.sh`).

            **Atualizar:** faça um backup e execute o instalador (ou o .deb) da versão nova por cima. Os dados são mantidos.
            **Guarde uma cópia da chave dos dados** (`data/chave-dados.key`) fora do servidor.
            O guia completo está em **INSTALACAO.md** e a relação com as normas da DCTIM em **CONFORMIDADE.md**.
