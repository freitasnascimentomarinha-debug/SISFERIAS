# Roda os testes do servidor e a compilação da interface a cada envio e
# Pull Request. Um "X" vermelho no GitHub indica que algo quebrou.
name: Testes

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  # Confere a instalação por Docker: monta a imagem, sobe o container e
  # verifica se o sistema responde e cria o administrador inicial.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar a imagem
        run: docker build -t sisferias:ci .
      - name: Subir o container e testar
        run: |
          docker run -d --name sisferias -p 3000:3000 -e ADMIN_PASSWORD=Teste@123 -v "$PWD/dados-ci:/app/data" sisferias:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
          curl -fs http://localhost:3000/api/health
          curl -fs http://localhost:3000/ | grep -q '<div id="root">'
          curl -fs -H 'X-Requested-With: sisferias' -H 'Content-Type: application/json' \
            -d '{"login":"admin","password":"Teste@123"}' http://localhost:3000/api/auth/login | grep -q '"role":"admin"'
          test -f dados-ci/sisferias.db
          docker logs sisferias
      - name: Conferir o docker-compose.yml
        run: docker compose config -q
