# Roda os testes do servidor e a compilação da interface a cada envio e
# Pull Request. Um "X" vermelho no GitHub indica que algo quebrou.
name: Testes

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  # Confere a instalação por Docker: sobe o PostgreSQL e o SISFERIAS pelo
  # docker-compose e verifica HTTPS, login, privilégio mínimo e cifragem.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar o arquivo .env de teste
        run: |
          printf 'SISFERIAS_DONO_SENHA=DonoTesteCi2026\nSISFERIAS_APP_SENHA=AppTesteCi2026\n' > .env
      - name: Conferir o docker-compose.yml
        run: docker compose config -q
      - name: Subir os contêineres
        run: docker compose up -d --build
      - name: Testar
        run: |
          for i in $(seq 1 60); do curl -fsk https://localhost:3000/api/health && break; sleep 2; done
          curl -fsk https://localhost:3000/api/health
          curl -fsk https://localhost:3000/ | grep -q '<div id="root">'
          sudo test -f data/chave-dados.key
          SENHA=$(sudo sed -n 's/^Senha provisória: //p' data/ADMIN_INICIAL.txt)
          curl -fsk -H 'X-Requested-With: sisferias' -H 'Content-Type: application/json' \
            -d "{\"login\":\"admin\",\"password\":\"$SENHA\"}" https://localhost:3000/api/auth/login | grep -q '"must_change_password":true'
          # Dados pessoais cifrados no banco
          docker exec sisferias-banco psql -U sisferias_dono -d sisferias -Atc "SELECT name FROM profiles" | grep -q '^enc:v1:'
          # Usuário da aplicação não apaga o registro de operações
          ! docker exec -e PGPASSWORD=AppTesteCi2026 sisferias-banco psql -h localhost -U sisferias_app -d sisferias -c "DELETE FROM operation_log"
          docker logs sisferias
