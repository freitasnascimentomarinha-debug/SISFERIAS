                -webkit-print-color-adjust: exact !important;

            @page {

            }
            .page-break {

                box-sizing: border-box;
                position: relative;
                overflow: hidden;
                background: white;
            }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
